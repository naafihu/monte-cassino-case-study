<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaking the Gustav Line</title>
<meta name="description" content="Operational case study: The Battle of Monte Cassino, prepared by Syndicate 15.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ece3cd;
    --surface:#fbf8f0;
    --ink:#2a241c;
    --muted:#6b6250;
    --accent:#af8b4f;
    --accent-dark:#5a4530;
    --rule:#c9b98a;
    --shadow: 0 18px 40px -20px rgba(42,36,28,0.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15130f;
      --surface:#211f1b;
      --ink:#f1ede3;
      --muted:#a89a7c;
      --accent:#c9a36a;
      --accent-dark:#af8b4f;
      --rule:#463b28;
      --shadow: 0 18px 40px -18px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130f;
    --surface:#211f1b;
    --ink:#f1ede3;
    --muted:#a89a7c;
    --accent:#c9a36a;
    --accent-dark:#af8b4f;
    --rule:#463b28;
    --shadow: 0 18px 40px -18px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
    padding-inline:20px;
    padding-block:36px 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', 'Courier New', monospace;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }

  h1{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:clamp(28px,6vw,44px);
    line-height:1.08;
    text-align:center;
    margin:0 0 8px;
    text-wrap:balance;
    max-width:16ch;
  }

  .sub{
    font-style:italic;
    color:var(--muted);
    font-size:15px;
    text-align:center;
    margin:0 0 2px;
  }

  .dates{
    font-family:'IBM Plex Mono', 'Courier New', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--muted);
    margin:6px 0 28px;
  }

  .credit{
    font-size:13px;
    color:var(--muted);
    text-align:center;
    margin:0 0 32px;
  }
  .credit b{color:var(--ink); font-weight:600;}

  .wrap{
    width:100%;
    max-width:900px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  figure{
    margin:0;
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:6px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  figure a{display:block; line-height:0;}
  figure img{
    width:100%;
    display:block;
  }

  figcaption{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    border-top:1px solid var(--rule);
    font-family:'IBM Plex Mono', 'Courier New', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  figcaption span.tag{
    color:var(--accent-dark);
    font-weight:600;
  }
  :root:not([data-theme="light"]) figcaption span.tag{color:var(--accent);}
  :root[data-theme="dark"] figcaption span.tag{color:var(--accent);}

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:-14px;
  }

  .actions{
    margin-top:36px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
  }

  a.btn{
    font-family:'IBM Plex Mono','Courier New',monospace;
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    text-decoration:none;
    padding:13px 26px;
    border-radius:3px;
    border:1px solid var(--accent-dark);
    transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  a.btn.primary{
    background:var(--accent-dark);
    color:var(--surface);
  }
  a.btn.primary:hover{ transform:translateY(-1px); }
  a.btn.secondary{
    background:transparent;
    color:var(--ink);
    border-color:var(--rule);
  }
  a.btn.secondary:hover{ border-color:var(--accent); color:var(--accent-dark); }
  :root:not([data-theme="light"]) a.btn.secondary:hover{ color:var(--accent); }
  :root[data-theme="dark"] a.btn.secondary:hover{ color:var(--accent); }

  footer{
    margin-top:40px;
    text-align:center;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--muted);
    font-family:'IBM Plex Mono','Courier New',monospace;
  }

  @media (min-width:640px){
    body{padding-block:56px 64px;}
  }
</style>
</head>
<body>

<p class="eyebrow">Operational Case Study</p>
<h1>Breaking the Gustav Line</h1>
<p class="sub">The Battle of Monte Cassino &mdash; A Strategic Analysis</p>
<p class="dates">17 JANUARY&nbsp;&ndash;&nbsp;18 MAY 1944</p>
<p class="credit">Prepared by <b>Syndicate 15</b> &middot; General Sir John Kotelawala Defence University</p>

<div class="wrap">
  <figure>
    <a href="leaflet-outside.jpg" target="_blank" rel="noopener">
      <img src="leaflet-outside.jpg" alt="Leaflet outside panels: About This Study, Strategic Lessons, and cover">
    </a>
    <figcaption><span class="tag">Outside</span><span>Cover &middot; Strategic Lessons &middot; About</span></figcaption>
  </figure>

  <figure>
    <a href="leaflet-inside.jpg" target="_blank" rel="noopener">
      <img src="leaflet-inside.jpg" alt="Leaflet inside panels: The Objective, The Timeline, The Analysis">
    </a>
    <figcaption><span class="tag">Inside</span><span>Objective &middot; Timeline &middot; Analysis</span></figcaption>
  </figure>
</div>

<div class="actions">
  <a class="btn primary" href="leaflet.pdf" target="_blank" rel="noopener">Open full PDF</a>
</div>

<footer>MONTE CASSINO &nbsp;&middot;&nbsp; SYNDICATE 15</footer>

</body>
</html>
